<section class="home-reviews" aria-labelledby="home-reviews-title">
  <header class="home-reviews__header">
    <h2 id="home-reviews-title" class="home-reviews__title">What our customers say</h2>
    @if (rating) {
      <a class="home-reviews__google-btn" [href]="profileUrl" target="_blank" rel="noopener noreferrer"
         [attr.aria-label]="rating + ' out of 5 on Google. See our Google reviews (opens in a new tab)'">
        <app-review-stars [rating]="+rating" size="15px" />
        <span>{{ rating }} on Google</span>
      </a>
    }
  </header>

  <div class="home-reviews__track" #track (scroll)="onScroll()">
    <ul class="home-reviews__google" role="list">
      @for (r of google; track r.name) {
        <li class="home-reviews__card home-reviews__card--google"><app-review-card [review]="r" [large]="true" /></li>
      }
    </ul>
    <ul class="home-reviews__buyer" role="list">
      @for (r of buyer; track r.name) {
        <li class="home-reviews__card"><app-review-card [review]="r" /></li>
      }
    </ul>
  </div>

  <div class="home-reviews__dots">
    @for (i of dots; track i) {
      <button type="button" class="home-reviews__dot" [class.home-reviews__dot--active]="active() === i"
              [attr.aria-label]="'Show review ' + (i + 1) + ' of ' + dots.length"
              [attr.aria-current]="active() === i ? 'true' : null"
              (click)="goTo(i)"></button>
    }
  </div>

  <div class="home-reviews__cta">
    <a routerLink="/reviews" class="home-reviews__all-btn">Read all reviews</a>
  </div>
</section>
