<div
  class="lightbox"
  role="dialog"
  aria-modal="true"
  aria-label="Photo viewer"
  appFocusTrap
>
  <div class="lightbox__backdrop" (click)="close()"></div>

  <div class="lightbox__bar">
    @if (hasMany()) {
      <span class="lightbox__counter" aria-live="polite">{{ index() + 1 }} / {{ images().length }}</span>
    }
    <button type="button" class="lightbox__btn lightbox__close" aria-label="Close photo viewer" (click)="close()">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>

  <div
    class="lightbox__stage"
    [class.lightbox__stage--zoomed]="zoomed()"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    <button
      type="button"
      class="lightbox__image-btn"
      [attr.aria-label]="zoomed() ? 'Zoom out' : 'Zoom in'"
      [attr.aria-pressed]="zoomed()"
      (click)="toggleZoom($event)"
      (pointermove)="onPointerMove($event)"
    >
      <img
        class="lightbox__image"
        [src]="currentSrc()"
        [alt]="alt() + (hasMany() ? ' — photo ' + (index() + 1) + ' of ' + images().length : '')"
        [style.transform]="transform()"
        [style.transform-origin]="transformOrigin()"
        decoding="async"
      />
    </button>
  </div>

  @if (hasMany()) {
    <button type="button" class="lightbox__btn lightbox__nav lightbox__nav--prev" aria-label="Previous photo" (click)="prev()">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" />
      </svg>
    </button>
    <button type="button" class="lightbox__btn lightbox__nav lightbox__nav--next" aria-label="Next photo" (click)="next()">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path d="M9 5l7 7-7 7" />
      </svg>
    </button>
  }

  <p class="lightbox__hint">{{ zoomed() ? 'Move to look around · click to zoom out' : 'Click the photo to zoom in' }}</p>
</div>
