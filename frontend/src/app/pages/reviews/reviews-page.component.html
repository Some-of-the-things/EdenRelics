<article class="reviews-page">
  <header class="reviews-page__header">
    <h1 class="reviews-page__title">Customer reviews</h1>
    @if (rating) {
      <a class="reviews-page__google-btn" [href]="profileUrl" target="_blank" rel="noopener noreferrer"
         [attr.aria-label]="rating + ' out of 5 on Google. See our Google reviews (opens in a new tab)'">
        <app-review-stars [rating]="+rating" size="15px" />
        <span>{{ rating }} on Google</span>
      </a>
    }
  </header>

  <ul class="reviews-page__list" role="list">
    @for (r of reviews(); track $index) {
      <li class="reviews-page__item" [class.reviews-page__item--google]="r.source === 'google'">
        <app-review-card [review]="r" [large]="r.source === 'google'" />
      </li>
    }
  </ul>
</article>
