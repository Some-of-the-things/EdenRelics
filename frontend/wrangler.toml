name = "eden-relics"
main = "dist/eden-relics/server/server.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/eden-relics/browser"
# `binding` is what creates `env.ASSETS`. Without it Cloudflare still SERVES the
# files (the asset server answers matching requests before the Worker runs), so
# the site looks fine — but inside the Worker `env.ASSETS` is `undefined` and
# every `env.ASSETS.fetch(...)` throws `Cannot read properties of undefined`.
# That silently disabled the CSR-shell fallback: every failed SSR render fell
# through to the last-resort 503 instead of degrading to a client-rendered page.
binding = "ASSETS"

# Retain Worker logs (Workers Logs). Without this, `wrangler tail` is live-only:
# the intermittent SSR failures that surface as last-resort 503s are far too rare
# to catch by tailing, so there is no record of what actually threw.
# head_sampling_rate = 1 keeps every invocation — traffic is a few thousand/day.
[observability]
enabled = true
head_sampling_rate = 1
